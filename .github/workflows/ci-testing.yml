name: CI

on:
  push:
    branches: [main, develop]
  pull_request:  # all target branches, so stacked PRs (e.g. feature-on-feature) get CI too

jobs:
  lint:
    name: Lint
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Pytest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-latest, depot-windows-2025, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short -m "not slow"
