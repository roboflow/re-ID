name: Publish Re-ID Releases to PyPI

on:
  release:
    types: [published]
  pull_request:
    branches: [main, develop, 'release/*']
    paths:
      - '.github/workflows/build-package.yml'
      - '.github/workflows/publish-release.yml'

permissions: {} # Explicitly remove all permissions by default

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-package.yml

  publish-release:
    name: Publish Release Package
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease != true
    runs-on: depot-ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/reid/
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI publishing
      contents: read # Required for checkout
    steps:
      - name: 📥 Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: List distribution artifacts
        run: ls -lh dist/

      - name: 🚀 Publish to PyPi
        # We only want to publish to PyPi if the event is a release and it's not a pre-release.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  publish-github-release:
    name: Upload GitHub Release Artifacts
    needs: build
    if: github.event_name == 'release'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create and update GitHub Releases
    steps:
      - name: 📥 Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: List distribution artifacts
        run: ls -lh dist/

      - name: 📦 Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
