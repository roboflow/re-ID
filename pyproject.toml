[project]
name = "roboflow-reid"
version = "0.1.0"
description = "Re-identification model stack for appearance embeddings"
readme = "README.md"
authors = [
  { name = "Roboflow et al.", email = "develop@roboflow.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["reid", "re-identification", "tracking", "computer-vision", "deep-learning"]

dependencies = [
    "numpy",
    "opencv-python",
    "supervision>=0.26.1",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "huggingface-hub>=0.20",
    "safetensors>=0.4",
    "Pillow>=10",
    "gdown>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.9.0",
    "pre-commit>=4.2.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reid"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
markers = [
    "slow: downloads curated weights (network)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
