site_name: Re-ID
site_url: https://roboflow.github.io/re-ID/
site_author: Roboflow
site_description: Re-identification models and gallery evaluation for appearance embeddings.
repo_name: roboflow/re-ID
repo_url: https://github.com/roboflow/re-ID
edit_uri: https://github.com/roboflow/re-ID/tree/main/docs

theme:
  name: material
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.tracking
    - navigation.expand
    - navigation.tabs

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Guides:
      - Load a model: guides/loading.md
      - Evaluate a gallery: guides/evaluation.md
  - API reference: api/reference.md
